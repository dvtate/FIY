<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Installed Apps — FIY/{{domain}}</title>
  <meta name="description" content="Your home for federated apps">
  <link rel="stylesheet" href="/portal/main.css">
  <script src="/portal/theme.js" defer></script>
  <style>
    .search { margin-bottom: 28px; }
    .search input { padding: 12px 14px; border-radius: 6px; }
    .apps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 72px;
    }
    .app-card {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .app-icon {
      flex: none;
      width: 86px;
      height: 86px;
      border-radius: 5px;
      object-fit: contain;
    }
    .app-info { flex: 1; min-width: 0; }
    .app-info h2 { font-size: 21px; margin: 0; }
    .app-info .version { font-size: 14px; font-style: italic; color: var(--muted); margin: 2px 0 10px; }
    .app-info p { margin: 0; }
    .app-path { flex: none; max-width: 100%; }
    .app-path a {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 16px;
      border: 1px solid var(--red);
      border-radius: 6px;
      color: var(--red);
      text-decoration: none;
    }
    .app-path a:hover { background: var(--red); color: var(--paper); }

    @media (max-width: 620px) {
      .app-card { flex-wrap: wrap; }
      .app-path { width: 100%; }
      .app-path a { text-align: center; }
    }

  </style>
</head>
<body>

<header>
  <div class="bar">
    <a class="wordmark" href="/">FIY<span>.</span></a>
    <div class="bar-right">
      <nav aria-label="Main navigation">
        <a href="/portal">Portal</a>
        <a href="/portal/login" class="current" aria-current="page">Log In</a>
        <a href="/portal/signup">Sign Up</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">&#9790;</button>
    </div>
  </div>
</header>
<main>
  <div class="page-head"><h1>Installed Apps</h1></div>
  <div class="search"><input type="search" placeholder="Find an installed app..." id="apps-search" aria-label="Find an installed app" autofocus></div>
  <div class="apps" id="installed-apps-list"></div>
  <p class="empty-state" id="apps-empty" role="status" hidden></p>
</main>
<script>
  const installedApps = {{installed_apps}};
  installedApps.sort((a, b) => a.name.localeCompare(b.name));

  // Build elements with textContent so module metadata is displayed as text.
  // TODO Revert. These apps are installed and trusted so XSS is actually a feature. (example: widgets)
  function makeAppEntry(app) {
    const card = document.createElement('article');
    card.className = 'app-card';
    const icon = document.createElement('img');
    icon.className = 'app-icon';
    icon.alt = '';

    // TODO don't set icon.src twice it: it always loads
    icon.src = '/portal/app.svg';
    if (app.icon) {
      try {
        const url = new URL(app.icon, window.location.origin);
        if (['http:', 'https:'].includes(url.protocol)) icon.src = url.href;
      } catch (_) { /* Use the built-in icon for invalid URLs. */ }
    }
    icon.addEventListener('error', () => { icon.src = '/portal/app.svg'; }, { once: true });
    const info = document.createElement('div');
    info.className = 'app-info';
    const name = document.createElement('h2');
    name.textContent = app.name;
    const version = document.createElement('p');
    version.className = 'version';
    version.textContent = `${app.id} version ${app.version}`;
    const description = document.createElement('p');
    description.textContent = app.description;
    info.append(name, version, description);
    const path = document.createElement('div');
    path.className = 'app-path';
    const link = document.createElement('a');
    // Module paths are local, even when metadata contains leading slashes.
    const localPath = '/' + String(app.path || '').replace(/^[\\/]+/, '');
    link.setAttribute('href', localPath.replace(/\\/g, '/'));
    link.textContent = localPath;
    path.append(link);
    card.append(icon, info, path);
    return card;
  }

  function searchApps() {
    const text = document.getElementById('apps-search').value.trim().toLocaleLowerCase();
    const matches = value => String(value || '').toLocaleLowerCase().includes(text);
    const titleMatches = installedApps.filter(app => matches(app.name) || matches(app.id));
    const entries = [...titleMatches, ...installedApps.filter(app => !titleMatches.includes(app) && matches(app.description))];
    document.getElementById('installed-apps-list').replaceChildren(...entries.map(makeAppEntry));
    const empty = document.getElementById('apps-empty');
    empty.hidden = entries.length > 0;
    empty.textContent = installedApps.length ? 'No apps match your search.' : 'No apps are installed on this instance yet.';
  }
  document.getElementById('apps-search').addEventListener('input', searchApps);
  searchApps();
</script>
<footer>
  FIY — Federate It Yourself.
</footer>
</body>
</html>
