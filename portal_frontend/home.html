<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Installed Apps — FIY/{{domain}}</title>
  <meta name="description" content="Your home for federated apps">
  <link rel="stylesheet" href="/portal/main.css">
  <script src="/portal/theme.js" defer></script>
  <style>
    .search { margin-bottom: 28px; }
    .search input { padding: 12px 14px; border-radius: 6px; }
    .apps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 72px;
    }
    .app-card {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .app-icon {
      flex: none;
      width: 86px;
      height: 86px;
      border-radius: 5px;
      object-fit: contain;
    }
    .app-info { flex: 1; min-width: 0; }
    .app-info h2 { font-size: 21px; margin: 0; }
    .app-info .version { font-size: 14px; font-style: italic; color: var(--muted); margin: 2px 0 10px; }
    .app-info p { margin: 0; }
    .app-path { flex: none; max-width: 100%; }
    .app-path a {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 16px;
      border: 1px solid var(--red);
      border-radius: 6px;
      color: var(--red);
      text-decoration: none;
    }
    .app-path a:hover { background: var(--red); color: var(--paper); }

    @media (max-width: 620px) {
      .app-card { flex-wrap: wrap; }
      .app-path { width: 100%; }
      .app-path a { text-align: center; }
    }

  </style>
</head>
<body>

<header>
  <div class="bar">
    <a class="wordmark" href="/">FIY<span>.</span></a>
    <div class="bar-right">
      <nav aria-label="Main navigation">
        <a href="/portal" class="current" aria-current="page">Portal</a>
        <a href="/portal/login">Log In</a>
        <a href="/portal/signup">Sign Up</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">&#9790;</button>
    </div>
  </div>
</header>
<main>
  <div class="page-head"><h1>Installed Apps</h1></div>
  <div class="search"><input type="search" placeholder="Find an installed app..." id="apps-search" aria-label="Find an installed app" autofocus></div>
  <div class="apps" id="installed-apps-list"></div>
  <p class="empty-state" id="apps-empty" role="status" hidden></p>
</main>
<script>
  // TODO JSON.parse("")
  const installedApps = {{installed_apps}};
  installedApps.sort((a, b) => a.name.localeCompare(b.name));

  function appEntry(app) {
    // TODO more than one button?
    const path = '/' + app.path;
    return `<article class="app-card">
    <img class="app-icon" src="${app.icon || '/portal/app.svg'}" alt="${app.id} icon">
    <div class="app-info">
      <h2>${app.name}</h2><p class="version">${app.id} version ${app.version}</p><p>${app.description}</p>
    </div>
    <div class="app-path"><a href="${path}">${path}</a></div>
</article>`;
  }

  function searchApps() {
    // Get search results
    const text = document.getElementById('apps-search').value.trim().toLocaleLowerCase();
    const matches = s => s.toLocaleLowerCase().includes(text);
    const entries = installedApps.filter(app =>
      matches(app.name) || matches(app.id) || matches(app.path));
    entries.push(...installedApps.filter(app =>
      !entries.includes(app) && matches(app.description)));

    // Show results
    document.getElementById('installed-apps-list').innerHTML = entries.map(appEntry).join('');
    const empty = document.getElementById('apps-empty');
    empty.hidden = entries.length > 0;
    empty.textContent = installedApps.length
      ? 'No apps match your search.'
      : 'No apps are currently installed on this instance.';
  }
  document.getElementById('apps-search').addEventListener('input', searchApps);
  searchApps();
</script>
</body>
</html>
