<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - FIY/{{domain}}</title>
<meta name="description" content="Your home for federated apps">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/portal/main.css?v=4">
<script src="/portal/theme.js?v=4"></script>
</head>
<body>

{{navbar}}

<main>
  <div class="login">
    <h1>Sign in to {{domain}}</h1>

    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <p class="error-msg" id="invalid-reason" role="alert">{{fail_reason}}</p>
      <button id="btn-submit" type="submit" class="btn btn-primary">Log In</button>
    </form>

    <hr class="rule">

    <div class="links">
      <a href="/portal/signup">Create an account</a>
      <a href="/">About {{domain}}</a>
    </div>
  </div>
</main>

<footer>
  FIY — Federate It Yourself.
</footer>

</body>
</html>
