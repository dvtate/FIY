<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - FIY/{{domain}}</title>
<meta name="description" content="Your home for federated apps">
<link rel="stylesheet" href="/portal/main.css">
<script src="/portal/theme.js" defer></script>
<style>
  .login { margin: 0 auto; }
  .login { max-width: 340px; padding: 72px 0 48px; }
  .login h1 { font-size: 26px; margin-bottom: 32px; }
  .login .btn-primary { width: 100%; margin-top: 6px; }

  @media (max-width: 480px) {
    .login { padding: 48px 0 40px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="wordmark" href="/">FIY<span>.</span></a>
    <div class="bar-right">
      <nav aria-label="Main navigation">
        <a href="/portal">Portal</a>
        <a href="/portal/login" class="current" aria-current="page">Log In</a>
        <a href="/portal/signup">Sign Up</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">&#9790;</button>
    </div>
  </div>
</header>
<main>
  <div class="login">
    <h1>Sign in to {{domain}}</h1>

    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <p class="error-msg" id="invalid-reason" role="alert">{{fail_reason}}</p>
      <button id="btn-submit" type="submit" class="btn btn-primary">Log In</button>
    </form>

    <hr class="rule">

    <div class="links">
      <a href="/portal/signup">Create an account</a>
      <a href="/">About {{domain}}</a>
    </div>
  </div>
</main>

</body>
</html>
