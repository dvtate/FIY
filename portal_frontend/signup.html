<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — FIY</title>
<link rel="stylesheet" href="/portal/main.css">
<script src="/portal/theme.js" defer></script>
<style>
    .signup { margin: 0 auto; }
    .signup { max-width: 380px; padding: 64px 0 80px; }
    .signup h1 { font-size: 28px; margin-bottom: 6px; }
    .signup > p { color: var(--muted); margin-bottom: 32px; font-size: 15px; }
    .signup .btn-primary { width: 100%; margin-top: 6px; }
    .signup .login-note { text-align: center; margin: 0; }

    @media (max-width: 480px) {
        .signup { padding: 40px 0 64px; }
    }
</style>
</head>
<body>
<header>
    <div class="bar">
        <a class="wordmark" href="/">FIY<span>.</span></a>
        <div class="bar-right">
            <nav aria-label="Main navigation">
                <a href="/portal">Portal</a>
                <a href="/portal/login">Log In</a>
                <a href="/portal/signup" class="current" aria-current="page">Sign Up</a>
            </nav>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">&#9790;</button>
        </div>
    </div>
</header>
<main>
  <div class="signup">
    <h1>Create your account</h1>
    <p>One account, every app on your instance.</p>

    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="janedoe" required pattern="[a-zA-Z0-9_]{2,32}" minlength="2" maxlength="32" autocomplete="username" aria-describedby="username-hint">
        <span class="hint" id="username-hint">Use 2–32 letters, numbers, or underscores.</span>
      </div>

      <div class="field">
        <label for="contact">Contact email (optional)</label>
        <input type="email" id="contact" name="contact" maxlength="255" autocomplete="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password">
      </div>

      <div class="field">
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" placeholder="Re-enter your password" required autocomplete="new-password">
      </div>

      <p class="error-msg" id="invalid-reason" role="alert">{{fail_reason}}</p>
      <button id="btn-submit" type="submit" class="btn btn-primary">Create account</button>
    </form>

    <div class="divider">or</div>

    <p class="login-note">Already have an account? <a href="/portal/login">Log in</a></p>
  </div>
</main>

<script>
const password = document.getElementById("password");
const confirmation = document.getElementById("password2");
function checkMatch() {
    confirmation.setCustomValidity(confirmation.value !== password.value ? "Passwords do not match." : "");
}
password.addEventListener("input", checkMatch);
confirmation.addEventListener("input", checkMatch);
</script>
</body>
</html>
