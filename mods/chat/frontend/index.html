<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chat — FIY</title>
    <meta name="description" content="Chat on FIY">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/portal/main.css?v=4">
    <script src="/portal/theme.js?v=4"></script>
    <style>
        body {
            margin: 0;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--paper);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Container for everything */
        .app {
            display: flex;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* Sidebar for chat list */
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--line);
            background: var(--panel);
            display: flex;
            flex-direction: column;
        }

        .search-bar {
            padding: 10px;
            border-bottom: 1px solid var(--line);
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }
        .chat-item:hover {
            background: var(--tint);
        }
        .chat-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .chat-details {
            flex: 1;
        }
        .chat-details .name {
            font-weight: bold;
        }
        .chat-details .status {
            font-size: 12px;
            color: var(--muted);
        }
        .chat-notification {
            background: var(--red);
            color: #fff;
            padding: 4px 8px;
            border-radius: 50%;
            font-size: 12px;
        }

        /* Chat area */
        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--paper);
        }
        .chat-header {
            padding: 10px 24px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            display: flex;
            align-items: center;
        }
        .chat-header img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .chat-messages {
            flex: 1;
            padding: 10px 24px;
            overflow-y: auto;
            background: var(--paper);
        }
        .message {
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 60%;
            clear: both;
            border: 1px solid var(--line);
        }
        .message.sent {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
            margin-left: auto;
        }
        .message.received {
            background: var(--panel);
            margin-right: auto;
        }
        .chat-input {
            display: flex;
            border-top: 1px solid var(--line);
            background: var(--panel);
            padding: 10px 24px;
        }
        .chat-input input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 20px;
            margin-right: 10px;
            background: var(--panel);
            color: var(--ink);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            .chat-view {
                width: 100%;
                display: none;
            }
            .chat-view.active {
                display: flex;
            }
            .sidebar.hidden {
                display: none;
            }
        }
    </style>
</head>
<body>
<header>
  <div class="bar">
    <a class="wordmark" href="/">FIY<span>.</span></a>
    <div class="bar-right">
      <nav aria-label="Main navigation"><a href="/portal">Portal</a><a href="/chat">Chat</a></nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">☾</button>
    </div>
  </div>
</header>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>
        <div class="chat-list">
            <div class="chat-item" onclick="openChat('John Doe')">
                <img src="https://via.placeholder.com/40" alt="profile">
                <div class="chat-details">
                    <div class="name">John Doe</div>
                    <div class="status">Online</div>
                </div>
                <div class="chat-notification">3</div>
            </div>
            <div class="chat-item" onclick="openChat('Jane Smith')">
                <img src="https://via.placeholder.com/40" alt="profile">
                <div class="chat-details">
                    <div class="name">Jane Smith</div>
                    <div class="status">Offline</div>
                </div>
                <div class="chat-notification">1</div>
            </div>
        </div>
    </div>

    <div class="chat-view" id="chatView">
        <div class="chat-header">
            <img src="https://via.placeholder.com/35" id="chatAvatar">
            <div id="chatName">Select a chat</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message received">Hello!</div>
            <div class="message sent">Hi, how are you?</div>
        </div>
        <div class="chat-input">
            <input type="text" placeholder="Type a message..." id="messageInput" aria-label="Type a message">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    function openChat(name) {
        document.getElementById("chatName").textContent = name;
        document.getElementById("chatView").classList.add("active");
        document.getElementById("sidebar").classList.add("hidden");
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (text === "") return;

        const msgContainer = document.getElementById("chatMessages");
        const msg = document.createElement("div");
        msg.className = "message sent";
        msg.textContent = text;
        msgContainer.appendChild(msg);

        input.value = "";
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    // Allow going back to chat list on mobile
    document.querySelector(".chat-header").addEventListener("click", () => {
        if (window.innerWidth <= 768) {
            document.getElementById("sidebar").classList.remove("hidden");
            document.getElementById("chatView").classList.remove("active");
        }
    });
</script>
</body>
</html>
