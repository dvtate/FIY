<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" sizes="any" type="image/svg+xml" href="{{fiy_baseuri}}/logo.svg">
    <title>Settings — {{repo_owner}}/{{repo_name}} | Git-IY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/portal/main.css?v=4">
    <script src="/portal/theme.js?v=4"></script>
</head>
<body>
<!--
- change visibility
- grant access
-->
<header>
  <div class="bar">
    <a class="wordmark" href="/">FIY<span>.</span></a>
    <div class="bar-right">
      <nav aria-label="Main navigation"><a href="//{{fiy_domain}}/portal">Portal</a><a href="{{fiy_baseuri}}">Git-IY</a></nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">☾</button>
    </div>
  </div>
</header>
<main class="settings">
<a href="{{fiy_baseuri}}">Back to Git-IY</a>
<div class="page-head"><h1>Repository Settings</h1></div>
<fieldset>
    <legend>Visibility</legend>
    <p>Change who can view this repository.</p>
    <button class="btn btn-secondary" type="button">Change visibility</button>
</fieldset>
<fieldset>
    <legend>Access</legend>
    <p>Grant collaborators access to this repository.</p>
    <button class="btn btn-secondary" type="button">Grant access</button>
</fieldset>
</main>
<footer>FIY — Federate It Yourself.</footer>
</body>
</html>
