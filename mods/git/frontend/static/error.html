<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git-IY - Error</title>
    <link rel="stylesheet" href="/portal/main.css">
    <script src="/portal/theme.js" defer></script>
</head>
<body>
<header>
  <div class="bar">
    <a class="wordmark" href="/">FIY<span>.</span></a>
    <div class="bar-right">
      <nav aria-label="Main navigation">
          <a href="//{{fiy_domain}}/portal">{{fiy_domain}} Portal</a>
          <a href="{{fiy_baseuri}}">Git-IY</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">&#9790;</button>
    </div>
  </div>
</header>
<main>
    <div class="page-head">
        <h1>That didn't work!</h1>
        <h2>{{error_title}}</h2>
        <p>{{error_description}}</p>
        <p>Sorry about that.</p>
        <div class="cta-row">
            <a class="btn btn-primary" href="{{fiy_baseuri}}">Home</a>
            <a class="btn btn-secondary" href="//{{fiy_domain}}/portal">{{fiy_domain}} Portal</a>
            {{links}}
        </div>
    </div>
</main>
<footer>FIY — Federate It Yourself.</footer>
</body>
</html>
